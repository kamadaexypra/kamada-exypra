        .contenedor {
            width: 80%;
            margin: 20px auto;
            overflow-x: auto;

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th,

            border: 1px solid #aaa;
            padding: 10px;
            height: 55px;
            text-align: left;
            vertical-align: middle;
        }

        th {
            text-align: center;
            height: 30px;
        }

        /* Primera columna gris */
        td:first-child {
            background-color: #5c5c5c;
        }

        /* Tamaños de columnas */
        th:nth-child(1),
        td:nth-child(1) {
            width: 22%;
        }

        th:nth-child(2),
        td:nth-child(2) {
            width: 15%;
        }

        th:nth-child(3),

        }

        th:nth-child(4),
        td:nth-child(4) {
            width: 19%;
        }

        th:nth-child(5),
        td:nth-child(5) {
            width: 19%;
        }

        @media (max-width: 800px) {
            .contenedor {
                width: 95%;
            }

            table {
                min-width: 900px;
            }
        }
    </style>
</head>
