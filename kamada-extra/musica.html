<!-- =========================
     JAVASCRIPT
========================== -->

<script>

const audio = document.getElementById("interlude");
const boton = document.getElementById("botonInterlude");
const icono = document.getElementById("iconoPlay");


boton.addEventListener("click", function () {

    if (audio.paused) {

        audio.play()
            .then(function () {

                icono.textContent = "❚❚";

            })
            .catch(function (error) {

                console.log("Error al reproducir:", error);

                alert("No se pudo reproducir la canción. Comprueba que el archivo de audio existe.");

            });

    } else {

        audio.pause();

        icono.textContent = "▶";

    }

});


audio.addEventListener("ended", function () {

    icono.textContent = "▶";

});


audio.addEventListener("error", function () {

    console.log("No se pudo cargar el archivo de audio.");

});

</script>
