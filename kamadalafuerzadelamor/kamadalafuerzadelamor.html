<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Kamada, La Fuerza del Amor</title>

    <link rel="stylesheet" href="../estilo.css">

    <style>

        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .pagina-escritura {
            max-width: 900px;
            margin: 50px auto;
            padding: 30px;
        }

        .pagina-escritura h1 {
            color: #BFFF00;
            margin-bottom: 10px;
        }

        .pagina-escritura p {
            color: #aaa;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            min-height: 600px;

            padding: 25px;

            background: white;
            color: black;

            border: none;
            border-radius: 5px;

            font-size: 18px;
            line-height: 1.8;

            resize: vertical;
        }

        .botones {
            margin-top: 20px;

            display: flex;
            gap: 15px;
        }

        .botones button {
            padding: 12px 20px;

            border: none;
            border-radius: 5px;

            background: #BFFF00;
            color: black;

            cursor: pointer;

            font-size: 16px;
        }

        .botones button:hover {
            background: white;
        }

    </style>

</head>


<body>


<header>

    <h1>
        <a href="../index.html">
            KAMADA;EXYPRA
        </a>
    </h1>

    <p>
        Kamada, La Fuerza del Amor
    </p>

</header>


<nav>

    <a href="../index.html">
        Inicio
    </a>

    <a href="kamadalafuerzadelamor.html">
        Kamada, La Fuerza del Amor
    </a>

    <a href="../kamada-extra/musica.html">
        Música
    </a>

</nav>


<main class="pagina-escritura">

    <h1>
        Kamada, La Fuerza del Amor
    </h1>

    <p>
        Escribe aquí tu historia.
    </p>


    <textarea
        id="editor"
        placeholder="Empieza a escribir aquí..."></textarea>


    <div class="botones">

        <button onclick="guardarTexto()">
            Guardar
        </button>

        <button onclick="borrarTexto()">
            Borrar
        </button>

    </div>

</main>


<script>

    const editor = document.getElementById("editor");


    /* RECUPERAR TEXTO GUARDADO */

    const textoGuardado =
        localStorage.getItem("kamadaFuerzaAmor");

    if (textoGuardado) {

        editor.value = textoGuardado;

    }


    /* GUARDAR */

    function guardarTexto() {

        localStorage.setItem(
            "kamadaFuerzaAmor",
            editor.value
        );

        alert("Texto guardado");

    }


    /* BORRAR */

    function borrarTexto() {

        const confirmar =
            confirm("¿Seguro que quieres borrar todo?");

        if (confirmar) {

            editor.value = "";

            localStorage.removeItem(
                "kamadaFuerzaAmor"
            );

        }

    }

</script>


</body>

</html>
